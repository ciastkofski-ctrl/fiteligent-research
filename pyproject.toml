[project]
name = "fiteligent-research"
version = "0.1.0"
description = "Weekly automated research-curation routine for fiteligent.pl"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "feedparser>=6.0.11",
    "jinja2>=3.1.4",
    "markdown-it-py>=3.0.0",
    "premailer>=3.10.0",
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.1",
]

[tool.setuptools]
packages = ["scripts", "scripts.lib"]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
pythonpath = ["."]
